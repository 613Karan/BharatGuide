[project]
name = "argo-rag"
version = "0.1.0"
description = "Grounded RAG over Election Commission of India source documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "qdrant-client>=1.12",
    "fastembed>=0.7",       # bge-small + BM25 (ONNX, light)
    "FlagEmbedding>=1.3",   # only needed for ARGO_PROFILE=m3
]

# Scripts-only project: nothing to build/install, `uv run python -m ...` works
# from the project root.
[tool.uv]
package = false
